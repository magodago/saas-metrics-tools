<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora CAC SaaS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora CAC para SaaS</h1>
        <form id="cac-form">
            <label for="marketing-cost">Coste de Marketing y Ventas (€):</label>
            <input type="number" id="marketing-cost" step="0.01" required><br>

            <label for="new-customers">Número de Clientes Nuevos:</label>
            <input type="number" id="new-customers" min="0" required><br>

            <button type="submit">Calcular CAC</button>
        </form>
        <div id="result"></div>
    </div>

<!-- MONETIZATION_BLOCK -->
<section class="monetization-block" aria-label="Recomendación">
  <p>Need help optimizing your SaaS metrics? We recommend using professional analytics tools.</p>
  <a href="#" class="monetization-cta">Explore tools</a>
</section>

</body>
</html>
