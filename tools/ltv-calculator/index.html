<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora LTV SaaS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de LTV (Lifetime Value) para SaaS</h1>
        <form id="ltv-form">
            <label for="avg-revenue-per-user">Ingresos medios por cliente:</label>
            <input type="number" step="0.01" id="avg-revenue-per-user" required><br>

            <label for="customer-retention-rate">Tasa de retención o churn (en %):</label>
            <input type="number" step="0.01" id="customer-retention-rate" required><br>

            <button type="submit">Calcular LTV</button>
        </form>
        <div id="result"></div>
    </div>

<!-- MONETIZATION_BLOCK -->
<section class="monetization-block" aria-label="Recomendación">
  <p>Need help optimizing your SaaS metrics? We recommend using professional analytics tools.</p>
  <a href="#" class="monetization-cta">Explore tools</a>
</section>

</body>
</html>
